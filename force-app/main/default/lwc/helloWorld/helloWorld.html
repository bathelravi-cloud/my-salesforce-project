<template>
        <lightning-card  title="Hello">
            <div class="slds-var-m-around_medium">
                <div class = "slds-size_1-of-3">
                    <lightning-input label = "Enter Location"
                        value={details.location}
                        onchange={handleChange}>
                    </lightning-input>
                </div>
                <p class="slds-p-horizontal_small">My Name is {details.name} and I am from {details.location}</p> 
            </div>
        </lightning-card>
        <lightning-card  title="@track Properties">
            <div class="slds-var-m-around_medium">
                <div class = "slds-size_1-of-3">
                    <lightning-input label = "Enter Location"
                        value={info.location}
                        onchange={handletrackChange}>
                    </lightning-input>
                </div>
                <p class="slds-p-horizontal_small">My Name is {info.name} and I am from {info.location}</p> 
            </div>
        </lightning-card>
        <lightning-card  title="Getter Property">
            <div class="slds-var-m-around_medium">
                <p> My first Name is {firstUser}</p>
                <p>Multiplication of {num1} and {num2} is {multiplicationValue}</p>
            </div>
        </lightning-card>
</template>
